cat > .github/workflows/ci.yml << 'EOF'
name: Docker CI

on:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-app:${{ github.sha }} .

      - name: Run container
        run: docker run -d -p 5000:5000 --name test-container my-app:${{ github.sha }}

      - name: Wait for container
        run: sleep 3

      - name: Test if app responds
        run: curl -f http://localhost:5000 || exit 1

      - name: Stop container
        run: docker stop test-container
EOF
